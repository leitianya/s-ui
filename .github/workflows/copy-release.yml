name: 一键同步 Tag、Release 与 Docker

run-name: >-
  ${{ inputs.operation }}
  ${{ inputs.copy_mode }}
  ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "请选择本次执行的操作"
        required: true
        type: choice
        default: "copy_release"
        options:
          - copy_release
          - publish_docker
          - sync_missing_tags
          - check_pat
      src_repo:
        description: "源仓库 owner/repo；留空则自动识别 Fork 上游"
        required: false
        type: string
        default: ""
      copy_mode:
        description: "版本选择模式"
        required: true
        type: choice
        default: "single"
        options:
          - single
          - multiple
          - all
          - date
          - range
      tag:
        description: "单个版本，仅 single 使用，例如 v1.6.3"
        required: false
        type: string
        default: ""
      tag_list:
        description: "多个版本，仅 multiple 使用；逗号或空格分隔"
        required: false
        type: string
        default: ""
      start_date:
        description: "开始日期，仅 date 使用，例如 2026-01-01"
        required: false
        type: string
        default: ""
      end_date:
        description: "结束日期，仅 date 使用，例如 2026-12-31"
        required: false
        type: string
        default: ""
      from_tag:
        description: "起始版本，仅 range 使用，例如 v1.0.0"
        required: false
        type: string
        default: ""
      to_tag:
        description: "结束版本，仅 range 使用，例如 v1.6.3"
        required: false
        type: string
        default: ""
      overwrite_assets:
        description: "是否覆盖同名 Release 附件"
        required: true
        type: choice
        default: "true"
        options: ["true", "false"]
      include_drafts:
        description: "是否包含草稿 Release"
        required: true
        type: choice
        default: "false"
        options: ["false", "true"]
      include_prereleases:
        description: "是否包含预发布版本"
        required: true
        type: choice
        default: "true"
        options: ["true", "false"]
      docker_skip_existing:
        description: "Docker 版本已存在时是否跳过"
        required: true
        type: choice
        default: "true"
        options: ["true", "false"]

permissions:
  contents: write
  actions: write
  packages: read

concurrency:
  group: release-copy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 识别仓库与筛选版本
    runs-on: ubuntu-24.04
    outputs:
      src_repo: ${{ steps.source.outputs.src_repo }}
      target_repo: ${{ steps.source.outputs.target_repo }}
      selected_json: ${{ steps.final.outputs.selected_json }}
      selected_count: ${{ steps.final.outputs.selected_count }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_SRC_REPO: ${{ inputs.src_repo }}
      TARGET_REPO: ${{ github.repository }}
      OPERATION: ${{ inputs.operation }}
      COPY_MODE: ${{ inputs.copy_mode }}
      SINGLE_TAG: ${{ inputs.tag }}
      TAG_LIST: ${{ inputs.tag_list }}
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      FROM_TAG: ${{ inputs.from_tag }}
      TO_TAG: ${{ inputs.to_tag }}
      INCLUDE_DRAFTS: ${{ inputs.include_drafts }}
      INCLUDE_PRERELEASES: ${{ inputs.include_prereleases }}
    steps:
      - name: 自动识别源仓库
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SRC_REPO}" ]; then
            SRC_REPO="${INPUT_SRC_REPO}"
            SOURCE_TYPE="手动指定"
          else
            REPO_INFO="$(gh api "repos/${TARGET_REPO}")"
            CURRENT_REPO="$(jq -r '.full_name' <<< "${REPO_INFO}")"
            PARENT_REPO="$(jq -r '.parent.full_name // empty' <<< "${REPO_INFO}")"
            if [ -n "${PARENT_REPO}" ]; then
              SRC_REPO="${PARENT_REPO}"
              SOURCE_TYPE="自动识别 Fork 上游"
            else
              SRC_REPO="${CURRENT_REPO}"
              SOURCE_TYPE="当前仓库不是 Fork"
            fi
          fi
          if ! printf '%s' "${SRC_REPO}" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::源仓库格式错误：${SRC_REPO}"
            exit 1
          fi
          echo "识别方式：${SOURCE_TYPE}"
          echo "源仓库：${SRC_REPO}"
          echo "目标仓库：${TARGET_REPO}"
          echo "src_repo=${SRC_REPO}" >> "${GITHUB_OUTPUT}"
          echo "target_repo=${TARGET_REPO}" >> "${GITHUB_OUTPUT}"

      - name: 检查运行环境
        env:
          SRC_REPO: ${{ steps.source.outputs.src_repo }}
        run: |
          set -euo pipefail
          gh --version
          git --version
          jq --version
          docker --version
          gh repo view "${SRC_REPO}" >/dev/null
          gh repo view "${TARGET_REPO}" >/dev/null

      - name: 获取并筛选版本
        id: select
        if: ${{ inputs.operation == 'copy_release' || inputs.operation == 'publish_docker' }}
        shell: bash
        env:
          SRC_REPO: ${{ steps.source.outputs.src_repo }}
        run: |
          set -euo pipefail
          RELEASE_FILE="${RUNNER_TEMP}/all-releases.json"
          SELECTED_FILE="${RUNNER_TEMP}/selected-releases.json"
          REQUESTED_TAGS="${RUNNER_TEMP}/requested-tags.txt"
          gh release list --repo "${SRC_REPO}" --limit 1000 --order asc \
            --json tagName,name,publishedAt,createdAt,isDraft,isPrerelease > "${RELEASE_FILE}"
          [ "$(jq 'length' "${RELEASE_FILE}")" -gt 0 ] || { echo "::error::源仓库没有 Release"; exit 1; }
          case "${COPY_MODE}" in
            single)
              [ -n "${SINGLE_TAG}" ] || { echo "::error::single 模式必须填写 tag"; exit 1; }
              jq --arg tag "${SINGLE_TAG}" '[.[] | select(.tagName == $tag)]' "${RELEASE_FILE}" > "${SELECTED_FILE}"
              ;;
            multiple)
              [ -n "${TAG_LIST}" ] || { echo "::error::multiple 模式必须填写 tag_list"; exit 1; }
              printf '%s\n' "${TAG_LIST}" | sed 's/[，；,;]/\n/g' | tr ' ' '\n' | sed '/^[[:space:]]*$/d' | sort -u > "${REQUESTED_TAGS}"
              jq --rawfile tags "${REQUESTED_TAGS}" '($tags|split("\n")|map(select(length>0))) as $w | [.[]|select(.tagName as $t|$w|index($t))]' "${RELEASE_FILE}" > "${SELECTED_FILE}"
              FOUND="${RUNNER_TEMP}/found.txt"; MISSING="${RUNNER_TEMP}/missing.txt"
              jq -r '.[].tagName' "${SELECTED_FILE}" | sort -u > "${FOUND}"
              comm -23 "${REQUESTED_TAGS}" "${FOUND}" > "${MISSING}"
              [ ! -s "${MISSING}" ] || { echo "::error::以下版本不存在："; cat "${MISSING}"; exit 1; }
              ;;
            all)
              cp "${RELEASE_FILE}" "${SELECTED_FILE}"
              ;;
            date)
              [ -n "${START_DATE}" ] && [ -n "${END_DATE}" ] || { echo "::error::date 模式必须填写日期"; exit 1; }
              date -d "${START_DATE}" >/dev/null 2>&1 || { echo "::error::开始日期格式错误"; exit 1; }
              date -d "${END_DATE}" >/dev/null 2>&1 || { echo "::error::结束日期格式错误"; exit 1; }
              START_TS="$(date -u -d "${START_DATE} 00:00:00" '+%Y-%m-%dT%H:%M:%SZ')"
              END_TS="$(date -u -d "${END_DATE} 23:59:59" '+%Y-%m-%dT%H:%M:%SZ')"
              [[ "${START_TS}" < "${END_TS}" || "${START_TS}" == "${END_TS}" ]] || { echo "::error::开始日期不能晚于结束日期"; exit 1; }
              jq --arg s "${START_TS}" --arg e "${END_TS}" '[.[]|select((.publishedAt//.createdAt)>=$s and (.publishedAt//.createdAt)<=$e)]' "${RELEASE_FILE}" > "${SELECTED_FILE}"
              ;;
            range)
              [ -n "${FROM_TAG}" ] && [ -n "${TO_TAG}" ] || { echo "::error::range 模式必须填写起止版本"; exit 1; }
              FROM_INDEX="$(jq --arg t "${FROM_TAG}" 'map(.tagName)|index($t)' "${RELEASE_FILE}")"
              TO_INDEX="$(jq --arg t "${TO_TAG}" 'map(.tagName)|index($t)' "${RELEASE_FILE}")"
              [ "${FROM_INDEX}" != null ] || { echo "::error::找不到 ${FROM_TAG}"; exit 1; }
              [ "${TO_INDEX}" != null ] || { echo "::error::找不到 ${TO_TAG}"; exit 1; }
              if [ "${FROM_INDEX}" -gt "${TO_INDEX}" ]; then T="${FROM_INDEX}"; FROM_INDEX="${TO_INDEX}"; TO_INDEX="${T}"; fi
              jq --argjson s "${FROM_INDEX}" --argjson e "${TO_INDEX}" '.[$s:($e+1)]' "${RELEASE_FILE}" > "${SELECTED_FILE}"
              ;;
            *) echo "::error::未知筛选模式"; exit 1 ;;
          esac
          if [ "${INCLUDE_DRAFTS}" != true ]; then jq '[.[]|select(.isDraft==false)]' "${SELECTED_FILE}" > "${SELECTED_FILE}.tmp"; mv "${SELECTED_FILE}.tmp" "${SELECTED_FILE}"; fi
          if [ "${INCLUDE_PRERELEASES}" != true ]; then jq '[.[]|select(.isPrerelease==false)]' "${SELECTED_FILE}" > "${SELECTED_FILE}.tmp"; mv "${SELECTED_FILE}.tmp" "${SELECTED_FILE}"; fi
          COUNT="$(jq 'length' "${SELECTED_FILE}")"
          [ "${COUNT}" -gt 0 ] || { echo "::error::没有选中任何版本"; exit 1; }
          jq -r '.[]|"版本：\(.tagName) | 日期：\(.publishedAt//.createdAt)"' "${SELECTED_FILE}"
          echo "selected_json=$(jq -c . "${SELECTED_FILE}")" >> "${GITHUB_OUTPUT}"
          echo "selected_count=${COUNT}" >> "${GITHUB_OUTPUT}"

      - name: 设置最终输出
        id: final
        shell: bash
        env:
          SELECTED_JSON: ${{ steps.select.outputs.selected_json }}
          SELECTED_COUNT: ${{ steps.select.outputs.selected_count }}
        run: |
          echo "selected_json=${SELECTED_JSON:-[]}" >> "${GITHUB_OUTPUT}"
          echo "selected_count=${SELECTED_COUNT:-0}" >> "${GITHUB_OUTPUT}"

  check-pat:
    name: 检查 WORKFLOW_PAT
    needs: prepare
    if: ${{ inputs.operation == 'check_pat' || inputs.operation == 'sync_missing_tags' }}
    runs-on: ubuntu-24.04
    env:
      TAG_PUSH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
      TARGET_REPO: ${{ needs.prepare.outputs.target_repo }}
    steps:
      - name: 检查 PAT
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${TAG_PUSH_TOKEN:-}" ] || { echo "::error::没有配置 WORKFLOW_PAT"; exit 1; }
          STATUS="$(curl -sS -o "${RUNNER_TEMP}/user.json" -w '%{http_code}' -H "Authorization: Bearer ${TAG_PUSH_TOKEN}" -H 'Accept: application/vnd.github+json' https://api.github.com/user)"
          [ "${STATUS}" = 200 ] || { echo "::error::PAT 无效，HTTP ${STATUS}"; exit 1; }
          echo "PAT 账号：$(jq -r .login "${RUNNER_TEMP}/user.json")"
          STATUS="$(curl -sS -o "${RUNNER_TEMP}/repo.json" -w '%{http_code}' -H "Authorization: Bearer ${TAG_PUSH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPO}")"
          [ "${STATUS}" = 200 ] || { echo "::error::PAT 无法访问目标仓库"; exit 1; }
          [ "$(jq -r '.permissions.push//false' "${RUNNER_TEMP}/repo.json")" = true ] || { echo "::error::PAT 没有写权限"; exit 1; }
          echo "WORKFLOW_PAT 基础检查通过。"

  sync-tags:
    name: 同步缺少的 Tag
    needs: [prepare, check-pat]
    if: ${{ inputs.operation == 'sync_missing_tags' }}
    runs-on: ubuntu-24.04
    env:
      TAG_PUSH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
      SRC_REPO: ${{ needs.prepare.outputs.src_repo }}
      TARGET_REPO: ${{ needs.prepare.outputs.target_repo }}
    steps:
      - name: 同步缺少的 Tag
        shell: bash
        run: |
          set -euo pipefail
          [ "${SRC_REPO}" != "${TARGET_REPO}" ] || { echo "源和目标相同，无需同步"; exit 0; }
          W="$(mktemp -d)"; trap 'rm -rf "${W}"' EXIT
          S="https://github.com/${SRC_REPO}.git"
          T="https://x-access-token:${TAG_PUSH_TOKEN}@github.com/${TARGET_REPO}.git"
          git -C "${W}" init -q
          git -C "${W}" remote add upstream "${S}"
          git ls-remote --tags --refs "${S}" | awk '{sub("refs/tags/","",$2);print $2}' | sort -u > "${W}/s"
          git ls-remote --tags --refs "${T}" | awk '{sub("refs/tags/","",$2);print $2}' | sort -u > "${W}/t"
          comm -23 "${W}/s" "${W}/t" > "${W}/m"
          TOTAL="$(wc -l < "${W}/m" | tr -d ' ')"; OK=0; SKIP=0; FAIL=0
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            if git ls-remote --exit-code --tags --refs "${T}" "refs/tags/${tag}" >/dev/null 2>&1; then SKIP=$((SKIP+1)); continue; fi
            if git -C "${W}" fetch --force upstream "refs/tags/${tag}:refs/tags/${tag}" && git -C "${W}" push "${T}" "refs/tags/${tag}:refs/tags/${tag}"; then
              echo "同步成功：${tag}"; OK=$((OK+1))
            else
              echo "::warning::同步失败：${tag}"; FAIL=$((FAIL+1))
            fi
          done < "${W}/m"
          echo "总数 ${TOTAL}，成功 ${OK}，跳过 ${SKIP}，失败 ${FAIL}"
          [ "${FAIL}" -eq 0 ]

  copy-release:
    name: 搬运 Release
    needs: prepare
    if: ${{ inputs.operation == 'copy_release' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SRC_REPO: ${{ needs.prepare.outputs.src_repo }}
      TARGET_REPO: ${{ needs.prepare.outputs.target_repo }}
      SELECTED_JSON: ${{ needs.prepare.outputs.selected_json }}
      OVERWRITE_ASSETS: ${{ inputs.overwrite_assets }}
    steps:
      - name: 搬运选中的 Release
        shell: bash
        run: |
          set -euo pipefail
          [ "${SRC_REPO}" != "${TARGET_REPO}" ] || { echo "::error::源和目标相同"; exit 1; }
          printf '%s' "${SELECTED_JSON}" > "${RUNNER_TEMP}/selected.json"
          OK=0; FAIL=0
          while IFS= read -r tag; do
            W="$(mktemp -d)"; mkdir -p "${W}/assets"
            if ! gh release view "${tag}" -R "${SRC_REPO}" --json name,body,isDraft,isPrerelease,tagName > "${W}/info.json"; then FAIL=$((FAIL+1)); rm -rf "${W}"; continue; fi
            title="$(jq -r '.name//.tagName' "${W}/info.json")"
            jq -r '.body//""' "${W}/info.json" > "${W}/body.md"
            draft="$(jq -r .isDraft "${W}/info.json")"; pre="$(jq -r .isPrerelease "${W}/info.json")"
            gh release download "${tag}" -R "${SRC_REPO}" -D "${W}/assets" || true
            if gh release view "${tag}" -R "${TARGET_REPO}" >/dev/null 2>&1; then
              args=(release edit "${tag}" -R "${TARGET_REPO}" --title "${title}" --notes-file "${W}/body.md" --draft="${draft}" --prerelease="${pre}")
            else
              args=(release create "${tag}" -R "${TARGET_REPO}" --title "${title}" --notes-file "${W}/body.md")
              git ls-remote --exit-code --tags --refs "https://github.com/${TARGET_REPO}.git" "refs/tags/${tag}" >/dev/null 2>&1 && args+=(--verify-tag)
              [ "${draft}" = true ] && args+=(--draft)
              [ "${pre}" = true ] && args+=(--prerelease)
            fi
            if gh "${args[@]}"; then
              mapfile -d '' files < <(find "${W}/assets" -maxdepth 1 -type f -print0)
              if [ "${#files[@]}" -gt 0 ]; then
                up=(release upload "${tag}" -R "${TARGET_REPO}"); [ "${OVERWRITE_ASSETS}" = true ] && up+=(--clobber); up+=("${files[@]}"); gh "${up[@]}"
              fi
              OK=$((OK+1))
            else FAIL=$((FAIL+1)); fi
            rm -rf "${W}"
          done < <(jq -r '.[].tagName' "${RUNNER_TEMP}/selected.json")
          echo "成功 ${OK}，失败 ${FAIL}"
          [ "${FAIL}" -eq 0 ]

  publish-docker:
    name: 一键发布 Docker
    needs: prepare
    if: ${{ inputs.operation == 'publish_docker' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_REPO: ${{ needs.prepare.outputs.target_repo }}
      SELECTED_JSON: ${{ needs.prepare.outputs.selected_json }}
      DOCKER_SKIP_EXISTING: ${{ inputs.docker_skip_existing }}
    steps:
      - name: 登录 GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 检查并触发 Docker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${SELECTED_JSON}" > "${RUNNER_TEMP}/selected.json"
          IMAGE="ghcr.io/${TARGET_REPO,,}"
          BRANCH="$(gh repo view "${TARGET_REPO}" --json defaultBranchRef --jq .defaultBranchRef.name)"
          OK=0; SKIP=0; FAIL=0
          while IFS= read -r tag; do
            if ! git ls-remote --exit-code --tags --refs "https://github.com/${TARGET_REPO}.git" "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "::warning::目标仓库不存在 Tag：${tag}"; FAIL=$((FAIL+1)); continue
            fi
            if [ "${DOCKER_SKIP_EXISTING}" = true ] && docker buildx imagetools inspect "${IMAGE}:${tag}" >/dev/null 2>&1; then
              echo "镜像已存在，跳过：${IMAGE}:${tag}"; SKIP=$((SKIP+1)); continue
            fi
            count="$(gh run list -R "${TARGET_REPO}" --workflow docker.yml --limit 100 --json displayTitle,status --jq --arg t "${tag}" '[.[]|select((.displayTitle|contains($t)) and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending"))]|length')"
            if [ "${count}" -gt 0 ]; then echo "已经在构建，跳过：${tag}"; SKIP=$((SKIP+1)); continue; fi
            if gh workflow run docker.yml -R "${TARGET_REPO}" --ref "${BRANCH}" -f "source_tag=${tag}"; then
              echo "已触发：${tag}"; OK=$((OK+1))
            else FAIL=$((FAIL+1)); fi
            sleep 3
          done < <(jq -r '.[].tagName' "${RUNNER_TEMP}/selected.json")
          echo "触发 ${OK}，跳过 ${SKIP}，失败 ${FAIL}"
          [ "${FAIL}" -eq 0 ]
