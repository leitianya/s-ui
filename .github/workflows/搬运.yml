name: 一键同步 Tag 与搬运 Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "请选择本次要执行的操作"
        required: true
        type: choice
        default: "copy_release"
        options:
          - copy_release
          - sync_missing_tags
          - check_pat

      src_repo:
        description: "源仓库 owner/repo；留空则自动识别当前 Fork 的上游仓库"
        required: false
        default: ""

      copy_mode:
        description: "Release 搬运模式，仅 copy_release 使用"
        required: true
        type: choice
        default: "single"
        options:
          - single
          - all
          - date
          - range

      tag:
        description: "单个版本，仅 single 模式填写，例如：v1.6.3"
        required: false
        default: ""

      start_date:
        description: "开始日期，仅 date 模式填写，例如：2026-01-01"
        required: false
        default: ""

      end_date:
        description: "结束日期，仅 date 模式填写，例如：2026-12-31"
        required: false
        default: ""

      from_tag:
        description: "起始版本，仅 range 模式填写，例如：v1.0.0"
        required: false
        default: ""

      to_tag:
        description: "结束版本，仅 range 模式填写，例如：v1.6.3"
        required: false
        default: ""

      overwrite_assets:
        description: "同名 Release 附件是否覆盖"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

      include_drafts:
        description: "是否包含草稿 Release"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

      include_prereleases:
        description: "是否包含预发布 Release"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: release-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  copy:
    name: 同步与搬运
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      INPUT_SRC_REPO: ${{ inputs.src_repo }}
      TARGET_REPO: ${{ github.repository }}
      OPERATION: ${{ inputs.operation }}

      COPY_MODE: ${{ inputs.copy_mode }}
      SINGLE_TAG: ${{ inputs.tag }}
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      FROM_TAG: ${{ inputs.from_tag }}
      TO_TAG: ${{ inputs.to_tag }}

      OVERWRITE_ASSETS: ${{ inputs.overwrite_assets }}
      INCLUDE_DRAFTS: ${{ inputs.include_drafts }}
      INCLUDE_PRERELEASES: ${{ inputs.include_prereleases }}

    steps:
      # ==========================================================
      # 自动识别源仓库
      #
      # 手动填写 src_repo 时使用手动值。
      # 留空且当前仓库是 Fork 时使用上游仓库。
      # 留空且当前仓库不是 Fork 时使用当前仓库。
      # ==========================================================
      - name: 自动识别源仓库
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${INPUT_SRC_REPO}" ]; then
            SRC_REPO="${INPUT_SRC_REPO}"
            SOURCE_TYPE="手动指定"
          else
            REPO_INFO="$(
              gh api \
                "repos/${TARGET_REPO}" \
                --jq '{
                  current: .full_name,
                  parent: (.parent.full_name // "")
                }'
            )"

            CURRENT_REPO="$(
              jq -r '.current' <<< "${REPO_INFO}"
            )"

            PARENT_REPO="$(
              jq -r '.parent' <<< "${REPO_INFO}"
            )"

            if [ -n "${PARENT_REPO}" ]; then
              SRC_REPO="${PARENT_REPO}"
              SOURCE_TYPE="自动识别 Fork 上游"
            else
              SRC_REPO="${CURRENT_REPO}"
              SOURCE_TYPE="当前仓库不是 Fork，使用当前仓库"
            fi
          fi

          if ! printf '%s' "${SRC_REPO}" |
            grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then

            echo "::error title=源仓库格式错误::正确格式应为 owner/repo"
            echo "当前值：${SRC_REPO}"
            exit 1
          fi

          echo "=========================================="
          echo "源仓库识别完成"
          echo "=========================================="
          echo "识别方式：${SOURCE_TYPE}"
          echo "源仓库：${SRC_REPO}"
          echo "目标仓库：${TARGET_REPO}"

          {
            echo "src_repo=${SRC_REPO}"
            echo "source_type=${SOURCE_TYPE}"
          } >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # 显示操作说明
      # ==========================================================
      - name: 显示本次执行操作
        shell: bash
        env:
          SRC_REPO: ${{ steps.source.outputs.src_repo }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "一键同步 Tag 与搬运 Release"
          echo "=========================================="
          echo "源仓库：${SRC_REPO}"
          echo "目标仓库：${TARGET_REPO}"
          echo "执行操作：${OPERATION}"
          echo ""

          case "${OPERATION}" in
            copy_release)
              echo "操作：搬运 Release"
              echo "搬运模式：${COPY_MODE}"
              echo ""
              echo "支持："
              echo "  single：搬运单个 Release"
              echo "  all：搬运全部 Release"
              echo "  date：按发布日期范围搬运"
              echo "  range：按版本范围搬运"
              ;;

            sync_missing_tags)
              echo "操作：同步缺少的 Tag"
              echo ""
              echo "安全规则："
              echo "  1. 只添加目标仓库缺少的 Tag"
              echo "  2. 不覆盖已有 Tag"
              echo "  3. 不修改已有 Tag"
              echo "  4. 不删除任何 Tag"
              echo "  5. 不搬运 Release"
              echo ""
              echo "此操作需要 Secret：WORKFLOW_PAT"
              ;;

            check_pat)
              echo "操作：检查 WORKFLOW_PAT"
              echo ""
              echo "检查过程不会："
              echo "  1. 推送 Tag"
              echo "  2. 创建 Release"
              echo "  3. 修改仓库内容"
              ;;

            *)
              echo "::error::未知操作：${OPERATION}"
              exit 1
              ;;
          esac

          echo "=========================================="

      # ==========================================================
      # 运行环境检查
      # ==========================================================
      - name: 检查运行环境
        shell: bash
        env:
          SRC_REPO: ${{ steps.source.outputs.src_repo }}
        run: |
          set -euo pipefail

          gh --version
          git --version
          jq --version
          curl --version

          echo ""
          echo "检查源仓库访问权限..."
          gh repo view "${SRC_REPO}" >/dev/null

          echo "检查目标仓库访问权限..."
          gh repo view "${TARGET_REPO}" >/dev/null

          echo "运行环境检查完成。"

      # ==========================================================
      # PAT 检查
      #
      # sync_missing_tags 和 check_pat 都执行。
      # ==========================================================
      - name: 检查 WORKFLOW_PAT
        if: ${{ inputs.operation == 'sync_missing_tags' || inputs.operation == 'check_pat' }}
        shell: bash
        env:
          TAG_PUSH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "检查 WORKFLOW_PAT"
          echo "=========================================="

          if [ -z "${TAG_PUSH_TOKEN:-}" ]; then
            echo "::error title=未配置 WORKFLOW_PAT::同步包含工作流文件的 Tag 需要 PAT"
            echo ""
            echo "请按照以下步骤配置："
            echo ""
            echo "1. 打开 GitHub 头像菜单"
            echo "2. 进入 Settings"
            echo "3. 进入 Developer settings"
            echo "4. 进入 Personal access tokens"
            echo "5. 进入 Tokens (classic)"
            echo "6. 创建 Classic PAT"
            echo "7. 勾选 repo 和 workflow"
            echo ""
            echo "然后进入目标仓库："
            echo ""
            echo "Settings"
            echo "→ Secrets and variables"
            echo "→ Actions"
            echo "→ New repository secret"
            echo ""
            echo "Secret 名称：WORKFLOW_PAT"
            echo ""
            echo "不要把 PAT 填入普通运行参数。"
            exit 1
          fi

          USER_RESPONSE="${RUNNER_TEMP}/pat-user.json"
          USER_HEADERS="${RUNNER_TEMP}/pat-user-headers.txt"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --dump-header "${USER_HEADERS}" \
              --output "${USER_RESPONSE}" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${TAG_PUSH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user"
          )"

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "::error title=WORKFLOW_PAT 无效::GitHub API 返回 HTTP ${HTTP_STATUS}"
            echo ""
            echo "可能原因："
            echo "  1. PAT 已过期"
            echo "  2. PAT 已被撤销"
            echo "  3. PAT 复制不完整"
            echo "  4. Secret 名称不是 WORKFLOW_PAT"
            exit 1
          fi

          PAT_LOGIN="$(
            jq -r '.login // "未知账号"' "${USER_RESPONSE}"
          )"

          echo "PAT 身份验证成功"
          echo "PAT 所属账号：${PAT_LOGIN}"

          TOKEN_SCOPES="$(
            grep -i '^x-oauth-scopes:' "${USER_HEADERS}" |
            cut -d ':' -f 2- |
            tr -d '\r' |
            xargs ||
            true
          )"

          if [ -n "${TOKEN_SCOPES}" ]; then
            echo "Classic PAT 权限：${TOKEN_SCOPES}"

            if ! printf '%s' "${TOKEN_SCOPES}" |
              grep -Eq '(^|, )[[:space:]]*workflow([[:space:]]*,|$)'; then

              echo "::warning title=可能缺少 workflow 权限::PAT 权限列表中没有检测到 workflow"
              echo "同步包含 .github/workflows 文件的 Tag 可能会失败。"
            else
              echo "已检测到 workflow 权限。"
            fi
          else
            echo "未从响应头读取到 Classic PAT 权限列表。"
            echo "如果使用 Fine-grained PAT，需要确认仓库内容和 Actions 工作流权限。"
          fi

          REPO_RESPONSE="${RUNNER_TEMP}/pat-repo.json"

          REPO_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output "${REPO_RESPONSE}" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${TAG_PUSH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${TARGET_REPO}"
          )"

          if [ "${REPO_STATUS}" != "200" ]; then
            echo "::error title=无法访问目标仓库::GitHub API 返回 HTTP ${REPO_STATUS}"
            echo ""
            echo "请确认 PAT 对以下仓库具有访问权限："
            echo "${TARGET_REPO}"
            exit 1
          fi

          PUSH_PERMISSION="$(
            jq -r '.permissions.push // false' "${REPO_RESPONSE}"
          )"

          if [ "${PUSH_PERMISSION}" != "true" ]; then
            echo "::error title=PAT 没有写入权限::当前 PAT 不能写入目标仓库"
            echo ""
            echo "目标仓库：${TARGET_REPO}"
            echo ""
            echo "请确认："
            echo "  1. PAT 所属账号对仓库有写入权限"
            echo "  2. Classic PAT 已勾选 repo"
            echo "  3. PAT 已完成组织 SSO 授权"
            exit 1
          fi

          echo "PAT 对目标仓库具有写入权限。"
          echo "WORKFLOW_PAT 基础检查通过。"

      # ==========================================================
      # 只检查 PAT 时结束
      # ==========================================================
      - name: PAT 检查完成
        if: ${{ inputs.operation == 'check_pat' }}
        shell: bash
        run: |
          echo "=========================================="
          echo "WORKFLOW_PAT 检查完成"
          echo "=========================================="
          echo "本次没有推送 Tag"
          echo "本次没有搬运 Release"
          echo "本次没有修改仓库"
          echo ""
          echo "下一步可以重新运行工作流并选择："
          echo "sync_missing_tags"

      # ==========================================================
      # 一次性同步缺少的 Tag
      #
      # 只新增，不覆盖，不删除。
      # 使用 WORKFLOW_PAT 推送，解决工作流文件权限问题。
      # ==========================================================
      - name: 一次性同步缺少的 Tag
        if: ${{ inputs.operation == 'sync_missing_tags' }}
        shell: bash
        env:
          SRC_REPO: ${{ steps.source.outputs.src_repo }}
          TAG_PUSH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail

          WORK_DIR="$(mktemp -d)"

          cleanup() {
            rm -rf "${WORK_DIR}"
          }

          trap cleanup EXIT

          if [ -z "${TAG_PUSH_TOKEN:-}" ]; then
            echo "::error::缺少 WORKFLOW_PAT"
            exit 1
          fi

          if [ "${SRC_REPO}" = "${TARGET_REPO}" ]; then
            echo "源仓库与目标仓库相同，无需同步。"
            exit 0
          fi

          SOURCE_URL="https://github.com/${SRC_REPO}.git"
          TARGET_URL="https://x-access-token:${TAG_PUSH_TOKEN}@github.com/${TARGET_REPO}.git"

          SOURCE_TAGS="${WORK_DIR}/source-tags.txt"
          TARGET_TAGS="${WORK_DIR}/target-tags.txt"
          MISSING_TAGS="${WORK_DIR}/missing-tags.txt"
          FAILED_TAGS="${WORK_DIR}/failed-tags.txt"

          : > "${SOURCE_TAGS}"
          : > "${TARGET_TAGS}"
          : > "${MISSING_TAGS}"
          : > "${FAILED_TAGS}"

          echo "=========================================="
          echo "开始同步缺少的 Tag"
          echo "=========================================="
          echo "源仓库：${SRC_REPO}"
          echo "目标仓库：${TARGET_REPO}"
          echo "规则：只新增、不覆盖、不修改、不删除"

          git -C "${WORK_DIR}" init --quiet
          git -C "${WORK_DIR}" remote add upstream "${SOURCE_URL}"

          echo ""
          echo "读取源仓库 Tag 列表..."

          git ls-remote \
            --tags \
            --refs \
            "${SOURCE_URL}" |
            awk '{
              sub("refs/tags/", "", $2)
              print $2
            }' |
            sort -u > "${SOURCE_TAGS}"

          echo "读取目标仓库 Tag 列表..."

          git ls-remote \
            --tags \
            --refs \
            "${TARGET_URL}" |
            awk '{
              sub("refs/tags/", "", $2)
              print $2
            }' |
            sort -u > "${TARGET_TAGS}"

          comm -23 \
            "${SOURCE_TAGS}" \
            "${TARGET_TAGS}" \
            > "${MISSING_TAGS}"

          SOURCE_COUNT="$(
            wc -l < "${SOURCE_TAGS}" |
            tr -d ' '
          )"

          TARGET_COUNT="$(
            wc -l < "${TARGET_TAGS}" |
            tr -d ' '
          )"

          MISSING_COUNT="$(
            wc -l < "${MISSING_TAGS}" |
            tr -d ' '
          )"

          echo ""
          echo "=========================================="
          echo "Tag 扫描结果"
          echo "=========================================="
          echo "源仓库 Tag 数量：${SOURCE_COUNT}"
          echo "目标仓库 Tag 数量：${TARGET_COUNT}"
          echo "缺少的 Tag 数量：${MISSING_COUNT}"

          if [ "${MISSING_COUNT}" -eq 0 ]; then
            echo ""
            echo "目标仓库没有缺少的 Tag，无需处理。"
            exit 0
          fi

          echo ""
          echo "准备同步以下 Tag："
          echo "------------------------------------------"
          cat "${MISSING_TAGS}"
          echo "------------------------------------------"

          SUCCESS_COUNT=0
          SKIPPED_COUNT=0
          FAILED_COUNT=0
          CURRENT_NUMBER=0

          while IFS= read -r TAG; do
            [ -n "${TAG}" ] || continue

            CURRENT_NUMBER=$((CURRENT_NUMBER + 1))

            echo ""
            echo "=========================================="
            echo "[${CURRENT_NUMBER}/${MISSING_COUNT}] ${TAG}"
            echo "=========================================="

            # 推送前再次检查，避免并发操作覆盖同名 Tag。
            if git ls-remote \
              --exit-code \
              --tags \
              --refs \
              "${TARGET_URL}" \
              "refs/tags/${TAG}" \
              >/dev/null 2>&1; then

              echo "目标仓库已经存在，跳过：${TAG}"
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              continue
            fi

            echo "正在从源仓库获取：${TAG}"

            if ! git -C "${WORK_DIR}" fetch \
              --force \
              upstream \
              "refs/tags/${TAG}:refs/tags/${TAG}"; then

              echo "::warning::获取源 Tag 失败：${TAG}"
              echo "${TAG}" >> "${FAILED_TAGS}"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            echo "正在推送到目标仓库：${TAG}"

            # 不使用 --force，因此不会覆盖目标仓库已有 Tag。
            if git -C "${WORK_DIR}" push \
              "${TARGET_URL}" \
              "refs/tags/${TAG}:refs/tags/${TAG}"; then

              echo "同步成功：${TAG}"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              # 推送失败后再次检查，有可能是另一个任务刚创建了该 Tag。
              if git ls-remote \
                --exit-code \
                --tags \
                --refs \
                "${TARGET_URL}" \
                "refs/tags/${TAG}" \
                >/dev/null 2>&1; then

                echo "目标仓库已出现同名 Tag，按已存在处理：${TAG}"
                SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              else
                echo "::warning::同步失败：${TAG}"
                echo "${TAG}" >> "${FAILED_TAGS}"
                FAILED_COUNT=$((FAILED_COUNT + 1))
              fi
            fi
          done < "${MISSING_TAGS}"

          echo ""
          echo "=========================================="
          echo "Tag 同步完成"
          echo "=========================================="
          echo "缺少数量：${MISSING_COUNT}"
          echo "新增成功：${SUCCESS_COUNT}"
          echo "已存在跳过：${SKIPPED_COUNT}"
          echo "同步失败：${FAILED_COUNT}"
          echo ""
          echo "没有覆盖已有 Tag"
          echo "没有修改已有 Tag"
          echo "没有删除任何 Tag"

          if [ "${FAILED_COUNT}" -gt 0 ]; then
            echo ""
            echo "同步失败的 Tag："
            cat "${FAILED_TAGS}"

            echo "::error::有 ${FAILED_COUNT} 个 Tag 同步失败"
            exit 1
          fi

          echo ""
          echo "所有缺少的 Tag 已同步完成。"

      # ==========================================================
      # 获取和筛选 Release
      # ==========================================================
      - name: 获取并筛选 Release
        if: ${{ inputs.operation == 'copy_release' }}
        id: select
        shell: bash
        env:
          SRC_REPO: ${{ steps.source.outputs.src_repo }}
        run: |
          set -euo pipefail

          RELEASE_FILE="${RUNNER_TEMP}/all-releases.json"
          SELECTED_FILE="${RUNNER_TEMP}/selected-releases.json"

          if [ "${SRC_REPO}" = "${TARGET_REPO}" ]; then
            echo "::error title=源仓库与目标仓库相同::当前仓库不是 Fork，或者 src_repo 填写了当前仓库"
            echo "请在 src_repo 中填写真正的源仓库 owner/repo。"
            exit 1
          fi

          echo "=========================================="
          echo "读取源仓库 Release"
          echo "=========================================="
          echo "源仓库：${SRC_REPO}"
          echo "搬运模式：${COPY_MODE}"

          gh release list \
            --repo "${SRC_REPO}" \
            --limit 1000 \
            --order asc \
            --json tagName,name,publishedAt,createdAt,isDraft,isPrerelease \
            > "${RELEASE_FILE}"

          TOTAL_COUNT="$(jq 'length' "${RELEASE_FILE}")"

          echo "源仓库 Release 数量：${TOTAL_COUNT}"

          if [ "${TOTAL_COUNT}" -eq 0 ]; then
            echo "::error::源仓库没有可读取的 Release"
            exit 1
          fi

          case "${COPY_MODE}" in
            single)
              if [ -z "${SINGLE_TAG}" ]; then
                echo "::error::single 模式必须填写 tag"
                exit 1
              fi

              jq \
                --arg tag "${SINGLE_TAG}" \
                '[.[] | select(.tagName == $tag)]' \
                "${RELEASE_FILE}" \
                > "${SELECTED_FILE}"
              ;;

            all)
              cp "${RELEASE_FILE}" "${SELECTED_FILE}"
              ;;

            date)
              if [ -z "${START_DATE}" ] || [ -z "${END_DATE}" ]; then
                echo "::error::date 模式必须填写 start_date 和 end_date"
                exit 1
              fi

              if ! date -d "${START_DATE}" >/dev/null 2>&1; then
                echo "::error::开始日期格式错误：${START_DATE}"
                exit 1
              fi

              if ! date -d "${END_DATE}" >/dev/null 2>&1; then
                echo "::error::结束日期格式错误：${END_DATE}"
                exit 1
              fi

              START_TS="$(
                date -u \
                  -d "${START_DATE} 00:00:00" \
                  '+%Y-%m-%dT%H:%M:%SZ'
              )"

              END_TS="$(
                date -u \
                  -d "${END_DATE} 23:59:59" \
                  '+%Y-%m-%dT%H:%M:%SZ'
              )"

              if [[ "${START_TS}" > "${END_TS}" ]]; then
                echo "::error::开始日期不能晚于结束日期"
                exit 1
              fi

              echo "发布日期范围：${START_TS} 至 ${END_TS}"

              jq \
                --arg start "${START_TS}" \
                --arg end "${END_TS}" \
                '[
                  .[]
                  | select(
                      (.publishedAt // .createdAt) >= $start
                      and
                      (.publishedAt // .createdAt) <= $end
                    )
                ]' \
                "${RELEASE_FILE}" \
                > "${SELECTED_FILE}"
              ;;

            range)
              if [ -z "${FROM_TAG}" ] || [ -z "${TO_TAG}" ]; then
                echo "::error::range 模式必须填写 from_tag 和 to_tag"
                exit 1
              fi

              FROM_INDEX="$(
                jq \
                  --arg tag "${FROM_TAG}" \
                  'map(.tagName) | index($tag)' \
                  "${RELEASE_FILE}"
              )"

              TO_INDEX="$(
                jq \
                  --arg tag "${TO_TAG}" \
                  'map(.tagName) | index($tag)' \
                  "${RELEASE_FILE}"
              )"

              if [ "${FROM_INDEX}" = "null" ]; then
                echo "::error::找不到起始版本：${FROM_TAG}"
                exit 1
              fi

              if [ "${TO_INDEX}" = "null" ]; then
                echo "::error::找不到结束版本：${TO_TAG}"
                exit 1
              fi

              if [ "${FROM_INDEX}" -gt "${TO_INDEX}" ]; then
                TEMP_INDEX="${FROM_INDEX}"
                FROM_INDEX="${TO_INDEX}"
                TO_INDEX="${TEMP_INDEX}"

                echo "起止版本顺序相反，已自动交换。"
              fi

              jq \
                --argjson start "${FROM_INDEX}" \
                --argjson end "${TO_INDEX}" \
                '.[$start:($end + 1)]' \
                "${RELEASE_FILE}" \
                > "${SELECTED_FILE}"
              ;;

            *)
              echo "::error::不支持的搬运模式：${COPY_MODE}"
              exit 1
              ;;
          esac

          if [ "${INCLUDE_DRAFTS}" != "true" ]; then
            jq \
              '[.[] | select(.isDraft == false)]' \
              "${SELECTED_FILE}" \
              > "${SELECTED_FILE}.tmp"

            mv "${SELECTED_FILE}.tmp" "${SELECTED_FILE}"
          fi

          if [ "${INCLUDE_PRERELEASES}" != "true" ]; then
            jq \
              '[.[] | select(.isPrerelease == false)]' \
              "${SELECTED_FILE}" \
              > "${SELECTED_FILE}.tmp"

            mv "${SELECTED_FILE}.tmp" "${SELECTED_FILE}"
          fi

          SELECTED_COUNT="$(jq 'length' "${SELECTED_FILE}")"

          if [ "${SELECTED_COUNT}" -eq 0 ]; then
            echo "::error::当前条件下没有找到需要搬运的 Release"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "即将搬运 ${SELECTED_COUNT} 个 Release"
          echo "=========================================="

          jq -r '
            .[]
            | "版本：\(.tagName) | 日期：\(.publishedAt // .createdAt) | 草稿：\(.isDraft) | 预发布：\(.isPrerelease)"
          ' "${SELECTED_FILE}"

          {
            echo "selected_file=${SELECTED_FILE}"
            echo "selected_count=${SELECTED_COUNT}"
          } >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # 搬运 Release
      # ==========================================================
      - name: 搬运选中的 Release
        if: ${{ inputs.operation == 'copy_release' }}
        shell: bash
        env:
          SRC_REPO: ${{ steps.source.outputs.src_repo }}
          SELECTED_FILE: ${{ steps.select.outputs.selected_file }}
          SELECTED_COUNT: ${{ steps.select.outputs.selected_count }}
        run: |
          set -euo pipefail

          SUCCESS_COUNT=0
          FAILED_COUNT=0
          CURRENT_NUMBER=0

          FAILED_FILE="${RUNNER_TEMP}/failed-releases.txt"
          : > "${FAILED_FILE}"

          copy_release() {
            local tag="$1"
            local current="$2"
            local total="$3"

            local work_dir
            local asset_dir
            local info_file
            local body_file
            local title
            local is_draft
            local is_prerelease

            work_dir="$(mktemp -d)"
            asset_dir="${work_dir}/assets"
            info_file="${work_dir}/release.json"
            body_file="${work_dir}/body.md"

            mkdir -p "${asset_dir}"

            echo ""
            echo "=================================================="
            echo "[${current}/${total}] 正在搬运：${tag}"
            echo "=================================================="

            if ! gh release view "${tag}" \
              --repo "${SRC_REPO}" \
              --json name,body,isDraft,isPrerelease,tagName,publishedAt \
              > "${info_file}"; then

              echo "::error::无法读取源 Release：${tag}"
              rm -rf "${work_dir}"
              return 1
            fi

            title="$(
              jq -r '.name // .tagName' "${info_file}"
            )"

            jq -r '.body // ""' "${info_file}" > "${body_file}"

            is_draft="$(
              jq -r '.isDraft' "${info_file}"
            )"

            is_prerelease="$(
              jq -r '.isPrerelease' "${info_file}"
            )"

            echo "标题：${title}"
            echo "草稿：${is_draft}"
            echo "预发布：${is_prerelease}"

            echo "正在下载附件..."

            if gh release download "${tag}" \
              --repo "${SRC_REPO}" \
              --dir "${asset_dir}"; then

              echo "附件下载完成。"
            else
              echo "该 Release 没有附件，或者附件下载失败。"
              echo "将继续创建或更新 Release。"
            fi

            if gh release view "${tag}" \
              --repo "${TARGET_REPO}" \
              >/dev/null 2>&1; then

              echo "目标 Release 已存在，正在更新..."

              EDIT_ARGS=(
                release
                edit
                "${tag}"
                --repo
                "${TARGET_REPO}"
                --title
                "${title}"
                --notes-file
                "${body_file}"
              )

              if [ "${is_draft}" = "true" ]; then
                EDIT_ARGS+=(--draft)
              else
                EDIT_ARGS+=(--draft=false)
              fi

              if [ "${is_prerelease}" = "true" ]; then
                EDIT_ARGS+=(--prerelease)
              else
                EDIT_ARGS+=(--prerelease=false)
              fi

              if ! gh "${EDIT_ARGS[@]}"; then
                echo "::error::更新目标 Release 失败：${tag}"
                rm -rf "${work_dir}"
                return 1
              fi
            else
              echo "目标 Release 不存在，正在创建..."

              CREATE_ARGS=(
                release
                create
                "${tag}"
                --repo
                "${TARGET_REPO}"
                --title
                "${title}"
                --notes-file
                "${body_file}"
              )

              # 目标仓库已经同步 Tag 时，要求 Tag 必须存在。
              # 这样不会错误地从默认分支创建同名 Tag。
              if git ls-remote \
                --exit-code \
                --tags \
                --refs \
                "https://github.com/${TARGET_REPO}.git" \
                "refs/tags/${tag}" \
                >/dev/null 2>&1; then

                CREATE_ARGS+=(--verify-tag)
              else
                echo "::warning::目标仓库不存在 Tag：${tag}"
                echo "::warning::GitHub 将从目标仓库默认分支创建同名 Tag"
                echo "::warning::如需保持源码一致，请先运行 sync_missing_tags"
              fi

              if [ "${is_draft}" = "true" ]; then
                CREATE_ARGS+=(--draft)
              fi

              if [ "${is_prerelease}" = "true" ]; then
                CREATE_ARGS+=(--prerelease)
              fi

              if ! gh "${CREATE_ARGS[@]}"; then
                echo "::error::创建目标 Release 失败：${tag}"
                rm -rf "${work_dir}"
                return 1
              fi
            fi

            mapfile -d '' ASSETS < <(
              find "${asset_dir}" \
                -maxdepth 1 \
                -type f \
                -print0
            )

            if [ "${#ASSETS[@]}" -gt 0 ]; then
              echo "正在上传 ${#ASSETS[@]} 个附件..."

              UPLOAD_ARGS=(
                release
                upload
                "${tag}"
                --repo
                "${TARGET_REPO}"
              )

              if [ "${OVERWRITE_ASSETS}" = "true" ]; then
                UPLOAD_ARGS+=(--clobber)
              fi

              UPLOAD_ARGS+=("${ASSETS[@]}")

              if ! gh "${UPLOAD_ARGS[@]}"; then
                echo "::error::附件上传失败：${tag}"
                rm -rf "${work_dir}"
                return 1
              fi
            else
              echo "该 Release 没有附件。"
            fi

            rm -rf "${work_dir}"

            echo "Release 搬运完成：${tag}"
            return 0
          }

          while IFS= read -r TAG; do
            [ -n "${TAG}" ] || continue

            CURRENT_NUMBER=$((CURRENT_NUMBER + 1))

            if copy_release \
              "${TAG}" \
              "${CURRENT_NUMBER}" \
              "${SELECTED_COUNT}"; then

              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              FAILED_COUNT=$((FAILED_COUNT + 1))
              echo "${TAG}" >> "${FAILED_FILE}"

              echo "::warning::Release ${TAG} 搬运失败，继续处理下一个"
            fi
          done < <(
            jq -r '.[].tagName' "${SELECTED_FILE}"
          )

          echo ""
          echo "=================================================="
          echo "Release 搬运完成"
          echo "=================================================="
          echo "总数量：${SELECTED_COUNT}"
          echo "成功：${SUCCESS_COUNT}"
          echo "失败：${FAILED_COUNT}"

          if [ "${FAILED_COUNT}" -gt 0 ]; then
            echo ""
            echo "搬运失败的 Release："
            cat "${FAILED_FILE}"

            echo "::error::有 ${FAILED_COUNT} 个 Release 搬运失败"
            exit 1
          fi

          echo ""
          echo "全部 Release 搬运成功。"
