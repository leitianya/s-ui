name: 一键搬运 Release（全功能通用版）

on:
  workflow_dispatch:
    inputs:
      src_repo:
        description: "源仓库 owner/repo；留空则自动识别 Fork 上游仓库"
        required: false
        default: ""

      sync_missing_tags:
        description: "仅同步缺少的 Tag，不搬运 Release"
        required: true
        type: boolean
        default: false

      copy_mode:
        description: "Release 搬运模式"
        required: true
        type: choice
        default: "single"
        options:
          - single
          - all
          - date
          - range

      tag:
        description: "单个版本号，仅 single 模式填写"
        required: false
        default: "v0.1.1"

      start_date:
        description: "开始日期，仅 date 模式填写，例如：2026-01-01"
        required: false
        default: ""

      end_date:
        description: "结束日期，仅 date 模式填写，例如：2026-12-31"
        required: false
        default: ""

      from_tag:
        description: "起始版本，仅 range 模式填写"
        required: false
        default: ""

      to_tag:
        description: "结束版本，仅 range 模式填写"
        required: false
        default: ""

      overwrite_assets:
        description: "目标 Release 存在同名附件时是否覆盖"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

      include_drafts:
        description: "是否搬运草稿 Release"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

      include_prereleases:
        description: "是否搬运预发布版本"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_SRC_REPO: ${{ inputs.src_repo }}
      TARGET_REPO: ${{ github.repository }}

      COPY_MODE: ${{ inputs.copy_mode }}
      SINGLE_TAG: ${{ inputs.tag }}
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      FROM_TAG: ${{ inputs.from_tag }}
      TO_TAG: ${{ inputs.to_tag }}

      OVERWRITE_ASSETS: ${{ inputs.overwrite_assets }}
      INCLUDE_DRAFTS: ${{ inputs.include_drafts }}
      INCLUDE_PRERELEASES: ${{ inputs.include_prereleases }}

    steps:
      # ==========================================================
      # 自动识别源仓库
      #
      # 1. 如果手动填写 src_repo，则使用手动值
      # 2. 如果留空且当前仓库是 Fork，则使用上游仓库
      # 3. 如果留空且不是 Fork，则使用当前仓库
      # ==========================================================
      - name: 自动识别源仓库
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${INPUT_SRC_REPO}" ]; then
            SRC_REPO="${INPUT_SRC_REPO}"
            SOURCE_TYPE="手动指定"
          else
            SRC_REPO="$(
              gh api \
                "repos/${TARGET_REPO}" \
                --jq '.parent.full_name // .full_name'
            )"

            PARENT_REPO="$(
              gh api \
                "repos/${TARGET_REPO}" \
                --jq '.parent.full_name // empty'
            )"

            if [ -n "${PARENT_REPO}" ]; then
              SOURCE_TYPE="自动识别 Fork 上游"
            else
              SOURCE_TYPE="当前仓库不是 Fork，使用当前仓库"
            fi
          fi

          if ! printf '%s' "${SRC_REPO}" |
            grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then

            echo "::error::源仓库格式错误：${SRC_REPO}"
            echo "::error::正确格式应为：owner/repo"
            exit 1
          fi

          echo "=========================================="
          echo "源仓库识别完成"
          echo "识别方式：${SOURCE_TYPE}"
          echo "源仓库：${SRC_REPO}"
          echo "目标仓库：${TARGET_REPO}"
          echo "=========================================="

          echo "src_repo=${SRC_REPO}" >> "${GITHUB_OUTPUT}"
          echo "source_type=${SOURCE_TYPE}" >> "${GITHUB_OUTPUT}"

      - name: 检查运行环境
        shell: bash
        env:
          SRC_REPO: ${{ steps.source.outputs.src_repo }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "运行环境检查"
          echo "源仓库：${SRC_REPO}"
          echo "目标仓库：${TARGET_REPO}"
          echo "=========================================="

          gh --version
          git --version
          jq --version

          echo "检查源仓库访问权限..."
          gh repo view "${SRC_REPO}" >/dev/null

          echo "检查目标仓库访问权限..."
          gh repo view "${TARGET_REPO}" >/dev/null

          echo "运行环境检查完成"

      # ==========================================================
      # 一次性同步缺少的 Tag
      #
      # 开启 sync_missing_tags 后：
      # 1. 只同步目标仓库不存在的 Tag
      # 2. 已存在的 Tag 一律跳过
      # 3. 不比较已有 Tag
      # 4. 不覆盖已有 Tag
      # 5. 不删除任何 Tag
      # 6. 不执行 Release 搬运
      # ==========================================================
      - name: 一次性同步缺少的 Tag
        if: ${{ inputs.sync_missing_tags == true }}
        shell: bash
        env:
          SRC_REPO: ${{ steps.source.outputs.src_repo }}
        run: |
          set -euo pipefail

          WORK_DIR="$(mktemp -d)"

          cleanup() {
            rm -rf "${WORK_DIR}"
          }

          trap cleanup EXIT

          SOURCE_URL="https://github.com/${SRC_REPO}.git"
          TARGET_URL="https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"

          SOURCE_TAGS="${WORK_DIR}/source-tags.txt"
          TARGET_TAGS="${WORK_DIR}/target-tags.txt"
          MISSING_TAGS="${WORK_DIR}/missing-tags.txt"
          FAILED_TAGS="${WORK_DIR}/failed-tags.txt"

          : > "${SOURCE_TAGS}"
          : > "${TARGET_TAGS}"
          : > "${MISSING_TAGS}"
          : > "${FAILED_TAGS}"

          echo "=========================================="
          echo "开始同步缺少的 Tag"
          echo "源仓库：${SRC_REPO}"
          echo "目标仓库：${TARGET_REPO}"
          echo "规则：只新增、不覆盖、不修改、不删除"
          echo "=========================================="

          if [ "${SRC_REPO}" = "${TARGET_REPO}" ]; then
            echo ""
            echo "源仓库和目标仓库相同。"
            echo "当前仓库不是 Fork，或者手动指定了当前仓库。"
            echo "没有需要同步的 Tag。"
            exit 0
          fi

          git -C "${WORK_DIR}" init --quiet
          git -C "${WORK_DIR}" remote add upstream "${SOURCE_URL}"
          git -C "${WORK_DIR}" remote add target "${TARGET_URL}"

          echo "正在读取源仓库 Tag..."

          git ls-remote \
            --tags \
            --refs \
            "${SOURCE_URL}" |
            awk '{
              sub("refs/tags/", "", $2)
              print $2
            }' |
            sort -u > "${SOURCE_TAGS}"

          echo "正在读取目标仓库 Tag..."

          git ls-remote \
            --tags \
            --refs \
            "${TARGET_URL}" |
            awk '{
              sub("refs/tags/", "", $2)
              print $2
            }' |
            sort -u > "${TARGET_TAGS}"

          comm -23 \
            "${SOURCE_TAGS}" \
            "${TARGET_TAGS}" \
            > "${MISSING_TAGS}"

          SOURCE_COUNT="$(
            wc -l < "${SOURCE_TAGS}" |
            tr -d ' '
          )"

          TARGET_COUNT="$(
            wc -l < "${TARGET_TAGS}" |
            tr -d ' '
          )"

          MISSING_COUNT="$(
            wc -l < "${MISSING_TAGS}" |
            tr -d ' '
          )"

          echo ""
          echo "=========================================="
          echo "Tag 扫描结果"
          echo "=========================================="
          echo "源仓库 Tag 数量：${SOURCE_COUNT}"
          echo "目标仓库 Tag 数量：${TARGET_COUNT}"
          echo "缺少的 Tag 数量：${MISSING_COUNT}"

          if [ "${MISSING_COUNT}" -eq 0 ]; then
            echo ""
            echo "目标仓库没有缺少的 Tag，无需处理。"
            exit 0
          fi

          echo ""
          echo "准备同步以下 Tag："
          echo "------------------------------------------"
          cat "${MISSING_TAGS}"
          echo "------------------------------------------"

          SUCCESS_COUNT=0
          SKIPPED_COUNT=0
          FAILED_COUNT=0
          CURRENT_NUMBER=0

          while IFS= read -r TAG; do
            [ -n "${TAG}" ] || continue

            CURRENT_NUMBER=$((CURRENT_NUMBER + 1))

            echo ""
            echo "=========================================="
            echo "[${CURRENT_NUMBER}/${MISSING_COUNT}] ${TAG}"
            echo "=========================================="

            # 推送前再次检查，防止并发运行时出现同名 Tag
            if git ls-remote \
              --exit-code \
              --tags \
              --refs \
              "${TARGET_URL}" \
              "refs/tags/${TAG}" \
              >/dev/null 2>&1; then

              echo "目标仓库已经存在，跳过：${TAG}"
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              continue
            fi

            echo "正在从源仓库获取：${TAG}"

            if ! git -C "${WORK_DIR}" fetch \
              --force \
              upstream \
              "refs/tags/${TAG}:refs/tags/${TAG}"; then

              echo "::warning::获取源 Tag 失败：${TAG}"
              echo "${TAG}" >> "${FAILED_TAGS}"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            echo "正在推送到目标仓库：${TAG}"

            # 不使用 --force，确保不会覆盖已有 Tag
            if git -C "${WORK_DIR}" push \
              target \
              "refs/tags/${TAG}:refs/tags/${TAG}"; then

              echo "同步成功：${TAG}"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              # 推送失败后再次检查，有可能是并发任务已创建同名 Tag
              if git ls-remote \
                --exit-code \
                --tags \
                --refs \
                "${TARGET_URL}" \
                "refs/tags/${TAG}" \
                >/dev/null 2>&1; then

                echo "目标仓库已出现同名 Tag，按已存在处理：${TAG}"
                SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              else
                echo "::warning::同步失败：${TAG}"
                echo "${TAG}" >> "${FAILED_TAGS}"
                FAILED_COUNT=$((FAILED_COUNT + 1))
              fi
            fi
          done < "${MISSING_TAGS}"

          echo ""
          echo "=========================================="
          echo "Tag 同步完成"
          echo "=========================================="
          echo "缺少数量：${MISSING_COUNT}"
          echo "新增成功：${SUCCESS_COUNT}"
          echo "已存在跳过：${SKIPPED_COUNT}"
          echo "同步失败：${FAILED_COUNT}"
          echo ""
          echo "没有覆盖已有 Tag"
          echo "没有修改已有 Tag"
          echo "没有删除任何 Tag"

          if [ "${FAILED_COUNT}" -gt 0 ]; then
            echo ""
            echo "同步失败的 Tag："
            cat "${FAILED_TAGS}"

            echo "::error::有 ${FAILED_COUNT} 个 Tag 同步失败"
            exit 1
          fi

          echo ""
          echo "所有缺少的 Tag 已同步完成。"

      # ==========================================================
      # 获取并筛选 Release
      # ==========================================================
      - name: 获取并筛选 Release
        if: ${{ inputs.sync_missing_tags != true }}
        id: select
        shell: bash
        env:
          SRC_REPO: ${{ steps.source.outputs.src_repo }}
        run: |
          set -euo pipefail

          RELEASE_FILE="${RUNNER_TEMP}/all-releases.json"
          SELECTED_FILE="${RUNNER_TEMP}/selected-releases.json"

          echo "=========================================="
          echo "读取源仓库 Release"
          echo "源仓库：${SRC_REPO}"
          echo "搬运模式：${COPY_MODE}"
          echo "=========================================="

          gh release list \
            --repo "${SRC_REPO}" \
            --limit 1000 \
