name: Docker Image CI
run-name: "Docker ${{ inputs.source_tag || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "源码 Tag，例如 v1.6.3"
        required: true
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.repository }}-${{ inputs.source_tag || github.ref_name }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ inputs.source_tag || github.ref_name }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_TAG }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建前端
        run: |
          set -euo pipefail
          cd frontend
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/386, linux/arm64/v8, linux/arm/v7, linux/arm/v6]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_TAG }}
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend_dist
      - name: 平台名称
        run: |
          p='${{ matrix.platform }}'
          echo "PAIR=${p//\//-}" >> "${GITHUB_ENV}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并按摘要推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend-artifact
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha,scope=${{ env.PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PAIR }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
      - name: 导出摘要
        run: |
          d='${{ steps.build.outputs.digest }}'; h="${d#sha256:}"
          mkdir -p "${RUNNER_TEMP}/digests"; touch "${RUNNER_TEMP}/digests/${h}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PAIR }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: 创建多架构镜像
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*); [ "${#files[@]}" -gt 0 ] || exit 1
          refs=(); for f in "${files[@]}"; do refs+=("${IMAGE_NAME}@sha256:$(basename "${f}")"); done
          image="${IMAGE_NAME,,}"
          docker buildx imagetools create -t "${image}:${SOURCE_TAG}" "${refs[@]}"
          docker buildx imagetools inspect "${image}:${SOURCE_TAG}"
